[package]
name = "rex-relay"
version = "0.1.2"
edition = "2024"
# File::lock, used by the ownership registry, is stable from 1.89.
rust-version = "1.89"
license = "MIT"
description = "A guarded command-line relay for driving Claude Code panes in Rex sessions"
repository = "https://github.com/mbriggs/rex-relay"
readme = "README.md"
keywords = ["claude-code", "rex", "terminal", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
# rexrs is a vendored path dependency, which crates.io doesn't accept.
publish = false

[[bin]]
name = "rex-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
# Revision-8 generated types and explicit negotiation range (vendor/rexrs/REX-LINUX.md).
rexrs = { path = "vendor/rexrs", default-features = false, features = ["tungstenite"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
sha2 = "0.10"
toml = "0.8"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
